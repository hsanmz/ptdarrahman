# ============================================================
# PTDARRAHMAN — IP:PORT DEPLOYMENT DOCKER COMPOSE (VPS Linux)
# ============================================================
# Topologi IP:PORT mandiri di VPS tanpa domain/SSL:
#
#   1. frontend   → :3000 (Company Profile), :5173 (Superadmin), :5174 (PPDB)
#   2. api        → :8000 (FastAPI backend + docs di /docs)
#   3. mysql      → :3306 (Internal DB Engine, memory-optimized 128MB buffer pool)
#   4. phpmyadmin → :8085 (Web UI Database MySQL)
#   5. redis      → :6379 (Internal Cache & Rate Limiting)
#
# Seluruh container memakai restart: unless-stopped sehingga otomatis menyala
# saat server reboot/restart dari panel IDCloudHost.
# ============================================================

name: ptarrahman-ip

services:
  # ── 1. MySQL 8.0 (Database Lokal VPS) ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ptd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ptdarrahman_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptdarrahman}
      MYSQL_USER: ${MYSQL_USER:-ptdarrahman}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ptdarrahman_pass123}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=134217728
      --max-connections=50
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-ptdarrahman_root_pass} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── 2. phpMyAdmin (Web GUI Database) ───────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ptd-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 128m

  # ── 3. Redis (Cache & Session Rate Limit) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ptd-redis
    restart: unless-stopped
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 128mb
        --maxmemory-policy noeviction
        --save 60 1
        --loglevel notice
    volumes:
      - redis_data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── 4. Backend (Python/FastAPI) ────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ptd-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-ptdarrahman}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ptdarrahman_pass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ptdarrahman}
      MYSQL_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-ptdarrahman_secret_jwt_key_must_be_32_chars_min}
      CRON_SECRET: ${CRON_SECRET:-ptdarrahman_cron_secret_random_16}
      CORS_ORIGINS: "http://${PUBLIC_IP:-103.55.37.77}:3000,http://${PUBLIC_IP:-103.55.37.77}:5173,http://${PUBLIC_IP:-103.55.37.77}:5174,http://localhost:3000,http://localhost:5173,http://localhost:5174"
      WA_SERVICE_URL: ""
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── 5. Frontend Container (Company Profile, Superadmin, PPDB) ───────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_IP:-103.55.37.77}:8000
        VITE_API_URL: http://${PUBLIC_IP:-103.55.37.77}:8000
    container_name: ptd-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"   # companyprofile
      - "5173:5173"   # superadmin
      - "5174:5174"   # ppdb
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const ok=p=>new Promise(r=>{http.get(p,res=>{res.resume();r(res.statusCode===200)}).on('error',()=>r(false))});Promise.all([ok('http://localhost:3000'),ok('http://localhost:5173'),ok('http://localhost:5174')]).then(a=>process.exit(a.every(Boolean)?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
