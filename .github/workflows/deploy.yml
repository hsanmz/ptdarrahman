name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to IDCloudHost VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.55.37.77' }}
          username: ${{ secrets.VPS_USERNAME || 'admin-ptd' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "=== [CI/CD] 1. Mengambil pembaruan kode terbaru dari Git ==="
            TARGET_DIR=""
            for dir in "$HOME/project-ppdb" "/root/project-ppdb" "$HOME/ptdarrahman" "/root/ptdarrahman"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              echo "Error: Direktori repositori tidak ditemukan di server!"
              exit 1
            fi
            cd "$TARGET_DIR"

            git fetch origin main
            git reset --hard origin/main

            # Deteksi command docker (dengan atau tanpa sudo)
            DOCKER_CMD="docker"
            if ! docker ps >/dev/null 2>&1; then
              if sudo -n docker ps >/dev/null 2>&1; then
                DOCKER_CMD="sudo docker"
              else
                DOCKER_CMD="sudo docker"
              fi
            fi

            echo "=== [CI/CD] 2. Re-build dan perbarui container yang berubah ==="
            if [ -f .env.ip ]; then
              if ! grep -q "WA_SERVICE_API_KEY=" .env.ip; then
                WA_KEY=$(openssl rand -hex 32)
                WA_SECRET=$(openssl rand -hex 32)
                echo "WA_SERVICE_API_KEY=${WA_KEY}" >> .env.ip
                echo "WA_WEBHOOK_SECRET=${WA_SECRET}" >> .env.ip
              fi

              $DOCKER_CMD compose --env-file .env.ip -f docker-compose.ip.yml up -d --build --force-recreate
              
              # Tunggu sampai container API berstatus Up
              echo "Menunggu service API siap..."
              for i in $(seq 1 30); do
                if $DOCKER_CMD compose --env-file .env.ip -f docker-compose.ip.yml ps api 2>/dev/null | grep -qE "Up|running"; then
                  break
                fi
                sleep 2
              done

              $DOCKER_CMD compose --env-file .env.ip -f docker-compose.ip.yml exec -T api alembic upgrade heads || true
              $DOCKER_CMD cp apps/api/scripts/. ptd-api:/app/scripts/ 2>/dev/null || true
              $DOCKER_CMD compose --env-file .env.ip -f docker-compose.ip.yml exec -T -w /app api python -m scripts.seed || true
            elif [ -f .env.prod ]; then
              $DOCKER_CMD compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --force-recreate
              
              echo "Menunggu service API siap..."
              for i in $(seq 1 30); do
                if $DOCKER_CMD compose --env-file .env.prod -f docker-compose.prod.yml ps api 2>/dev/null | grep -qE "Up|running"; then
                  break
                fi
                sleep 2
              done

              $DOCKER_CMD compose --env-file .env.prod -f docker-compose.prod.yml exec -T api alembic upgrade heads || true
              $DOCKER_CMD cp apps/api/scripts/. ptd-api:/app/scripts/ 2>/dev/null || true
              $DOCKER_CMD compose --env-file .env.prod -f docker-compose.prod.yml exec -T -w /app api python -m scripts.seed || true
            fi

            echo "=== [CI/CD] 3. Membersihkan cache Docker agar storage 20GB tetap lega ==="
            $DOCKER_CMD image prune -f >/dev/null 2>&1 || true
            $DOCKER_CMD builder prune -f >/dev/null 2>&1 || true

            echo "=== [CI/CD] 4. Deploy Berhasil! ==="
