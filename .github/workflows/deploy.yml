name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to IDCloudHost VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '103.55.37.77' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== [CI/CD] 1. Mengambil pembaruan kode terbaru dari Git ==="
            TARGET_DIR=""
            for dir in "$HOME/project-ppdb" "/root/project-ppdb" "$HOME/ptdarrahman" "/root/ptdarrahman"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              echo "Error: Direktori repositori tidak ditemukan di server!"
              exit 1
            fi
            cd "$TARGET_DIR"

            git fetch origin main
            git reset --hard origin/main

            echo "=== [CI/CD] 2. Re-build dan perbarui container yang berubah ==="
            if [ -f .env.ip ]; then
              docker compose --env-file .env.ip -f docker-compose.ip.yml up -d --build --force-recreate
              docker compose --env-file .env.ip -f docker-compose.ip.yml exec -T api alembic upgrade heads
              docker cp apps/api/scripts/. ptd-api:/app/scripts/ 2>/dev/null || true
              docker compose --env-file .env.ip -f docker-compose.ip.yml exec -T -w /app api python -m scripts.seed
            elif [ -f .env.prod ]; then
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --force-recreate
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T api alembic upgrade heads
              docker cp apps/api/scripts/. ptd-api:/app/scripts/ 2>/dev/null || true
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T -w /app api python -m scripts.seed
            fi

            echo "=== [CI/CD] 3. Membersihkan cache Docker agar storage 20GB tetap lega ==="
            docker image prune -f >/dev/null 2>&1 || true
            docker builder prune -f >/dev/null 2>&1 || true

            echo "=== [CI/CD] 4. Deploy Berhasil! ==="
